    <script>
      (function () {
        var theme = 'light';

        try {
          theme = window.localStorage.getItem('zackmactavish-theme') === 'dark' ? 'dark' : 'light';
        } catch (error) {
          theme = 'light';
        }

        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;

        var themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) {
          themeColor.setAttribute('content', theme === 'dark' ? '#0a0a0a' : '#f3f0e8');
        }
      })();

      if ('scrollRestoration' in window.history) {
        window.history.scrollRestoration = 'manual';
      }

      window.addEventListener('pageshow', function () {
        if (window.location.pathname === '/') {
          window.scrollTo(0, 0);
        }
      });

      (function () {
        var locationData = window.location;
        if (locationData.search[1] !== '/') return;

        var decoded = locationData.search
          .slice(1)
          .split('&')
          .map(function (segment) {
            return segment.replace(/~and~/g, '&');
          })
          .join('?');

        window.history.replaceState(null, '', locationData.pathname.slice(0, -1) + decoded + locationData.hash);
      })();
    </script>

    <style>
      :root {
        --initial-background: #f3f0e8;
        --initial-text: #181818;
        --initial-muted: rgba(24, 24, 24, 0.68);
      }

      :root[data-theme='dark'] {
        --initial-background: #0a0a0a;
        --initial-text: #f3f0e8;
        --initial-muted: rgba(243, 240, 232, 0.68);
      }

      html,
      body,
      #root {
        margin: 0;
        min-height: 100%;
        background: var(--initial-background);
      }

      /* Static landing skeleton — painted instantly on first byte for mobile.
         React replaces this when LandingPage mounts. Visual styles mirror the
         mobile header in src/pages/Landing_Page/LandingPage.jsx so there is no
         layout shift. */
      #landing-skeleton {
        color: var(--initial-text);
        min-height: 100vh;
        padding: 0 1rem;
        box-sizing: border-box;
        margin-top: max(9vh, 4.75rem);
      }
      #landing-skeleton .kicker {
        font-family: monospace;
        font-size: 0.72rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--initial-muted);
        margin: 0 0 0.75rem;
      }
      #landing-skeleton h1 {
        font-family: 'Space Grotesk', system-ui, sans-serif;
        font-size: clamp(2rem, 11vw, 3rem);
        line-height: 0.95;
        margin: 0;
        text-transform: uppercase;
        letter-spacing: 0.02em;
      }
      #landing-skeleton .lede {
        font-family: 'Space Grotesk', system-ui, sans-serif;
        font-size: 1rem;
        line-height: 1.6;
        color: var(--initial-muted);
        margin: 1rem 0 0;
      }
    </style>

    <title>Zack MacTavish Art & Design</title>
  </head>
  <body>
    <!-- React root -->
    <div id="root">
      <div id="landing-skeleton" aria-hidden="true">
        <p class="kicker">Artist Portfolio</p>
        <h1>Zack MacTavish</h1>
        <p class="lede">
          Drawing, painting, quilting, and graffiti-based work anchored by personal history,
          domestic memory, and image-making across physical and digital forms.
        </p>
      </div>
    </div>
    <script>
      // Strip the skeleton immediately on routes other than home, or on
      // larger pointer-fine devices where the intro animation owns the
      // first paint.
      (function () {
        var sk = document.getElementById('landing-skeleton');
        if (!sk) return;
        var path = window.location.pathname;
        var isHome = path === '/' || path === '';
        var mq = window.matchMedia(
          '(max-width: 768px), (pointer: coarse), (prefers-reduced-motion: reduce)'
        );
        if (!isHome || !mq.matches) {
          sk.parentNode && sk.parentNode.removeChild(sk);
        }
      })();
    </script>
